name: FisherTown CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source integrity and asset checks
        run: npm run validate

      - name: Typecheck and build
        run: npm run build
      - name: Add ready-to-play helpers
        run: |
          cp deploy/README-PLAY.txt dist/README-PLAY.txt
          cp deploy/START-XAMPP.cmd dist/START-XAMPP.cmd
      - name: Upload ready-to-play web build
        uses: actions/upload-artifact@v4
        with:
          name: FisherTown-v0.5-Web
          path: dist/
          if-no-files-found: error
          retention-days: 30

  browser-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Chromium for smoke tests
        run: npx playwright install --with-deps chromium
      - name: Browser tests (portrait + landscape)
        run: npm run smoke
      - name: Upload screenshots and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FisherTown-v0.5-browser-smoke
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
