name: FisherTown CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Source integrity and asset checks
        run: npm run validate

      - name: Typecheck and build
        run: npm run build
      - name: Add ready-to-play helpers
        run: |
          cp deploy/README-PLAY.txt dist/README-PLAY.txt
          cp deploy/START-XAMPP.cmd dist/START-XAMPP.cmd
      - name: Upload ready-to-play web build
        uses: actions/upload-artifact@v4
        with:
          name: FisherTown-v0.1-Web
          path: dist/
          if-no-files-found: error
          retention-days: 30
